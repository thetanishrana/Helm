<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProjectFlow — Sprint Tasks</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px;
         margin: 35px auto; color: #303642; }
  header { padding: 18px; background: #eff4fa; }
  .task { padding: 20px; border: 1px solid #ddd; margin: 20px 0; }
  label { display: block; margin: 15px 0; }
  button { padding: 11px; margin-right: 12px; }
  .save { background: #2d6ca2; color: white; border: none; }
</style>
</head>
<body>
<header><h1>ProjectFlow</h1><p>Sprint 12 — Release readiness</p></header>

<main>
  <h2>Quality assurance checklist</h2>

  <div class="task">
    <h3>Release verification</h3>

    <label>
      <input type="checkbox">
      QA passed
    </label>

    <label>
      <input type="checkbox">
      Documentation reviewed
    </label>

    <p>Mark completed items and click Save to update the task.</p>
  </div>

  <button class="save">Save</button>
  <button>Cancel</button>

  <hr>
  <h3>Project administration</h3>
  <p>Archiving removes this project from active workspaces.</p>
  <button>Archive entire project</button>
</main>
</body>
</html>
