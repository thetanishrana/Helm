<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="helm-token" content="__TOKEN__">
<title>Helm</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header id="status" class="ok" role="status" aria-live="polite">
  <span class="dot" aria-hidden="true"></span>
  <span id="status-text">Connecting…</span>
  <span class="spacer"></span>
  <button id="receipt-btn" class="quiet">Receipt</button>
</header>
<main>
  <section aria-labelledby="h-pending">
    <h2 id="h-pending">Needs your decision</h2>
    <div id="pending" class="empty">Nothing is waiting on you.</div>
  </section>
  <section aria-labelledby="h-timeline">
    <h2 id="h-timeline">What the agent did</h2>
    <ol id="timeline"></ol>
  </section>
</main>
<dialog id="receipt"><article id="receipt-body"></article><form method="dialog"><button>Close</button></form></dialog>
<script src="/ui/app.js"></script>
</body>
</html>
