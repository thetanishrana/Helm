<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="helm-token" content="__TOKEN__">
<title>Helm</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header id="status" class="ok" role="status" aria-live="polite">
  <span class="dot" aria-hidden="true"></span>
  <span id="status-text">Connecting…</span>
  <span class="spacer"></span>
  <button id="receipt-btn" class="quiet">Receipt</button>
</header>
<div id="task" hidden></div>
<div id="stopbar" hidden>
  <div><strong>The agent is about to run:</strong> <code id="stop-cmd"></code></div>
  <div class="stoprow"><button id="stop-btn" class="block">Stop the agent</button><span id="stop-count"></span></div>
  <div id="stop-progress"><div id="stop-fill"></div></div>
</div>
<main>
  <section aria-labelledby="h-pending">
    <h2 id="h-pending">Needs your decision</h2>
    <div id="pending" class="empty">Nothing is waiting on you.</div>
  </section>
  <section aria-labelledby="h-timeline">
    <h2 id="h-timeline">What the agent did</h2>
    <ol id="timeline"></ol>
  </section>
</main>
<dialog id="consent"><article><pre id="consent-text"></pre><label class="check"><input type="checkbox" id="consent-ok"> I have read this and I agree to take part.</label></article><button id="consent-go" class="block" disabled>Continue</button></dialog>
<dialog id="debrief"><article><pre id="debrief-text"></pre></article><form method="dialog"><button>Close</button></form></dialog>
<dialog id="intro"><article><p id="intro-block" class="why"></p><h3 id="intro-title"></h3><p>A person asked an AI agent to do this:</p><blockquote id="intro-task"></blockquote><p id="intro-help"></p></article><button id="intro-start" class="block">Start</button></dialog>
<dialog id="tlx"><form id="tlx-form"><h3>How was that?</h3><p class="why">Drag each slider. Answer about the task you just watched.</p><div id="tlx-items"></div><button class="block" type="submit">Submit</button></form></dialog>
<dialog id="receipt"><article id="receipt-body"></article><form method="dialog"><button>Close</button></form></dialog>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
